# STEP 3 — the job only a multi-service repo needs.
#
# Both suites above can be green while the two layers have drifted apart: rename
# an endpoint in the AI service, keep its own tests passing, and the Rails
# client 404s in production. Nothing so far would notice.
#
# The contract test asserts that every route the business backend calls still
# exists in the AI service's OpenAPI document. It reads
# docs/contract/business-backend-consumed-routes.json and checks it against the
# schema FastAPI generates from the live Pydantic models -- no server, no
# network.
#
# New here: the `contract` job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      ai-service: ${{ steps.filter.outputs.ai-service }}
      business-backend: ${{ steps.filter.outputs.business-backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai-service:
              - 'ai-service/**'
              - '.github/workflows/ci.yml'
            business-backend:
              - 'business-backend/**'
              - '.github/workflows/ci.yml'

  ai-service:
    name: AI service · tests
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    # Five test modules enter the FastAPI lifespan, which opens a Postgres pool
    # for the LangGraph checkpointer. Without a real Postgres each one blocks on
    # the pool timeout before the error is swallowed: the tests still pass, they
    # just take minutes.
    services:
      vector-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: estimator
          POSTGRES_PASSWORD: estimator
          POSTGRES_DB: estimator
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U estimator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENAI_API_KEY: sk-test-not-a-real-key
      DATABASE_URL: postgresql+psycopg://estimator:estimator@localhost:5433/estimator

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Run tests (LLM mocked — no tokens spent)
        run: uv run pytest -q

  business-backend:
    name: Business backend · tests
    needs: changes
    if: needs.changes.outputs.business-backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: business-backend
      - name: Lint
        run: bin/rubocop -f github
      # WebMock stubs every AI-service call, so this suite needs no live
      # dependency either -- the same rule as the Python side.
      - name: Run tests (AI service stubbed with WebMock)
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare test

  contract:
    name: Contract · business backend ↔ AI service
    needs: [changes, ai-service]
    # `always()` is load-bearing: GitHub skips a job whose dependency was
    # skipped, and `ai-service` IS skipped on a Rails-only change -- exactly
    # when the client side moved and the contract most needs checking.
    if: >-
      always() && !contains(needs.*.result, 'failure') && !cancelled() &&
      (needs.changes.outputs.ai-service == 'true' || needs.changes.outputs.business-backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      OPENAI_API_KEY: sk-test-not-a-real-key

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Verify the /v1 contract
        run: uv run python scripts/check_contract.py
