# STEP 1 — the smallest pipeline that is worth having.
#
# One job: install the AI service's dependencies and run its tests. Nothing
# else. If this is green, the code in the commit works.
#
# The one thing to notice: there is no real API key anywhere. `OPENAI_API_KEY`
# is a syntactically valid dummy, and every test doubles the LLM. A pipeline
# that called the real model would be slow, non-deterministic, rate-limited and
# billed -- it would fail for reasons that have nothing to do with the commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-service:
    name: AI service · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    env:
      # `app/config.py` refuses to build Settings without a provider key, so the
      # suite cannot even be collected without one. This is that -- and nothing
      # more. It never reaches the network.
      OPENAI_API_KEY: sk-test-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests (LLM mocked — no tokens spent)
        run: uv run pytest -q
